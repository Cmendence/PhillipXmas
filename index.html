<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <title>Phillip's The Elf</title>
  <style>
    .countdown-buttons {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .countdown-buttons button {
      padding: 10px 18px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      background-color: #c0282d;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      min-width: 180px;
    }
  </style>
</head>

<body>
  <div class="stage" role="main" aria-label="Phillip's Workshop Announcement">
    
    <!-- HEADER -->
    <header class="header">
      <div class="avatar" aria-hidden="true">
        <img src="images/beach_PX2026.jpg" alt="Phillip the elf">
      </div>

      <div class="title">
        <h1 class="gallery-title">It's good to be back!</h1>
        <h3 class="gallery-subtitle">Let's see what trouble we can get into…</h3>
      </div>

      <div class="countdown">
        <span class="number" id="countdown-display">--</span>
        <span class="label">until Phillip arrives!</span>
        <div class="countdown-buttons" id="countdown-buttons" style="display:none;">
          <button id="scavenger-btn">Start the Scavenger Hunt!</button>
          <button id="gallery-btn">Gallery</button>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="cards-container">
      <div class="grid" aria-label="Phillip's workshop activities">

        <article class="card">
          <img src="images/swimming_PX2026.jpg" alt="Phillip delivering gifts">
          <h3></h3>
          <p></p>
        </article>

        <article class="card">
          <img src="images/garden_PX2026.jpg" alt="Phillip relaxing">
          <h3></h3>
          <p></p>
        </article>

        <article class="card">
          <img src="images/halloween_PX2026.jpg" alt="Phillip checking the list">
          <h3></h3>
          <p></p>
        </article>

      </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer-inner">
        <div class="star" aria-hidden="true">★</div>
        <div class="small">Phillip's Workshop</div>
      </div>
    </footer>

  </div>


<script>
  (function(){
    const countdownDisplay = document.getElementById('countdown-display');
    const labelEl = countdownDisplay.nextElementSibling;
    const buttonsContainer = document.getElementById('countdown-buttons');
    const scavengerBtn = document.getElementById('scavenger-btn');
    const galleryBtn = document.getElementById('gallery-btn');
    const cardsContainer = document.getElementById('cards-container');

    scavengerBtn.addEventListener('click', () => {
      window.location.href = 'scavengerHome.html';
    });

    galleryBtn.addEventListener('click', () => {
      window.location.href = 'gallery.html';
    });

    function updateCountdown(nowOverride = null){
      const now = nowOverride || new Date();
      const year = now.getFullYear();

      // December 1st - Phillip returns
      const phillipReturns = new Date(year, 11, 1, 0, 0, 0);

      // Christmas Day
      const christmas = new Date(year, 11, 25, 0, 0, 0);
      const nextYearChristmas = new Date(year + 1, 11, 25, 0, 0, 0);

      let targetDate;
      let label;
      let isChristmas = false;

      // Determine which countdown to display
      if(now < phillipReturns){
        // Before December 1st: Countdown to Phillip's return
        targetDate = phillipReturns;
        label = "until Phillip comes back";
      } else if(now >= phillipReturns && now < christmas){
        // December 1st through December 24th: Countdown to Christmas
        targetDate = christmas;
        label = "until Christmas!";
      } else if(now >= christmas && now < nextYearChristmas){
        // Christmas Day
        isChristmas = true;
      } else {
        // After Christmas: Countdown to next year's Christmas
        targetDate = nextYearChristmas;
        label = "until Christmas!";
      }

      if(isChristmas){
        countdownDisplay.textContent = "🎄 Merry Christmas! 🎄";
        labelEl.textContent = "";
        buttonsContainer.style.display = "flex";
        cardsContainer.style.display = "none";
      } else {
        const diffMs = targetDate - now;
        const totalSeconds = Math.floor(diffMs / 1000);

        const days = Math.floor(totalSeconds / (3600*24));
        const hours = Math.floor((totalSeconds % (3600*24)) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        countdownDisplay.textContent =
          `${days}d ${hours}h ${minutes}m ${seconds}s`;

        labelEl.textContent = label;
        buttonsContainer.style.display = "none";
        cardsContainer.style.display = "block";
      }
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    // --------- For Testing Only ---------
    // Simulate November 30th (Phillip countdown)
    // updateCountdown(new Date("2026-11-30T23:59:00"));

    // Simulate December 1st (Christmas countdown)
    // updateCountdown(new Date("2026-12-01T00:00:00"));

    // Simulate Christmas Day
    // updateCountdown(new Date("2026-12-25T00:00:00"));
  })();
</script>

</body>
</html>
